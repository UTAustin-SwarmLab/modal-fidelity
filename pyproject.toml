[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "modalfidelity"
version = "1.0.0"
description = "ModalFidelity: Routing Modalities for Deepfake Detection on a Budget (ICASSP 2027)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []   # installed by environment.yml; see README "Setup"

[project.scripts]
mf-cache-previews = "modalfidelity.cli.cache_previews:main"
mf-cache-features = "modalfidelity.cli.cache_features:main"
mf-train-router = "modalfidelity.cli.train_router:main"
mf-evaluate-router = "modalfidelity.cli.evaluate_router:main"
mf-train-late-moe = "modalfidelity.cli.train_late_moe:main"
mf-evaluate-gate-placement = "modalfidelity.cli.evaluate_gate_placement:main"
mf-measure-flops = "modalfidelity.cli.measure_flops:main"
mf-reproduce-figures = "modalfidelity.cli.reproduce_figures:main"

[tool.setuptools.packages.find]
include = ["modalfidelity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
